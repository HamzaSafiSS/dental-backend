# ──────────────────────────────────────────────
# Database (from environment variables)
# ──────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://[YOUR_PROD_DB_HOST]:5432/[YOUR_PROD_DB_NAME]}
spring.datasource.username=${DATABASE_USERNAME:[YOUR_PROD_DB_USERNAME]}
spring.datasource.password=${DATABASE_PASSWORD:[YOUR_PROD_DB_PASSWORD]}
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ──────────────────────────────────────────────
# Flyway
# ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# ──────────────────────────────────────────────
# Actuator Security
# ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ──────────────────────────────────────────────
# JWT Security
# ──────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:[YOUR_PROD_JWT_SECRET_BASE64]}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging.level.com.dental.dentalbackend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ──────────────────────────────────────────────
# OpenAPI / Swagger (disabled in production)
# ──────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ──────────────────────────────────────────────
# Mail (Brevo SMTP)
# SMTP_HOST=smtp-relay.brevo.com
# SMTP_PORT=587
# ──────────────────────────────────────────────

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@dental-clinic.com}
