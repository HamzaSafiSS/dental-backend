# ──────────────────────────────────────────────
# Database (from environment variables)
# ──────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dental_clinic}
spring.datasource.username=${DATABASE_USERNAME:ramadan}
spring.datasource.password=${DATABASE_PASSWORD:ramadan1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ──────────────────────────────────────────────
# Flyway
# ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# ──────────────────────────────────────────────
# Actuator Security
# ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ──────────────────────────────────────────────
# JWT Security
# ──────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ZGVudGFsLWNsaW5pYy1tYW5hZ2VtZW50LXN5c3RlbS1qd3Qtc2VjcmV0LWtleS0yMDI0LXByb2R1Y3Rpb24=}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging.level.com.dental.dentalbackend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ──────────────────────────────────────────────
# OpenAPI / Swagger (disabled in production)
# ──────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
