# ──────────────────────────────────────────────
# Database (Docker Compose PostgreSQL)
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/dental_clinic
#"Spring Boot, connect to the PostgreSQL database named dental_clinic, running on my computer at port 5432."
spring.datasource.username=ramadan
spring.datasource.password=ramadan1111
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────────
# JPA
# ──────────────────────────────────────────────
spring.jpa.show-sql=true

# ──────────────────────────────────────────────
# Flyway
# ──────────────────────────────────────────────
spring.flyway.clean-disabled=false

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging.level.com.dental.dentalbackend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ──────────────────────────────────────────────
# OpenAPI / Swagger
# ──────────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
