spring.application.name=dental-backend

# Load .env file automatically (same pattern as rent-collector)
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ──────────────────────────────────────────────
# Jackson
# ──────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

server.port=8080

# ──────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ──────────────────────────────────────────────
# JWT
# ──────────────────────────────────────────────
# Base64-encoded HMAC-SHA256 secret (min 256 bits). Override in prod via env var.
app.jwt.secret=ZGVudGFsLWNsaW5pYy1tYW5hZ2VtZW50LXN5c3RlbS1qd3Qtc2VjcmV0LWtleS0yMDI0LXByb2R1Y3Rpb24=
# Access token: 15 minutes (in milliseconds)
app.jwt.access-token-expiration=900000
# Refresh token: 7 days (in milliseconds)
app.jwt.refresh-token-expiration=604800000

# ──────────────────────────────────────────────
# File Upload
# ──────────────────────────────────────────────
app.upload.dir=uploads
app.upload.base-url=/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ──────────────────────────────────────────────
# Mail (Brevo SMTP)
# Set these in your .env file
# SMTP_HOST=smtp-relay.brevo.com
# SMTP_PORT=587
# SMTP_USER=<your Brevo SMTP login>
# SMTP_PASS=<your Brevo SMTP password>
# ──────────────────────────────────────────────
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sender identity — MUST be a verified sender in Brevo (e.g., safihamza395@gmail.com)
spring.mail.from=${MAIL_FROM:noreply@dental-clinic.com}

